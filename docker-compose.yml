services:
  db:
    image: postgres:16-alpine
    container_name: asm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: asm
      POSTGRES_PASSWORD: asm
      POSTGRES_DB: asm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asm -d asm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    container_name: asm-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Compose network hostname (overrides localhost from .env when present)
      DATABASE_URL: postgresql+psycopg://asm:asm@db:5432/asm
      APP_ENV: development
      DEBUG: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeAdmin123!}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Platform Admin}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: