name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asm
          POSTGRES_PASSWORD: asm
          POSTGRES_DB: asm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asm -d asm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TESTING: "true"
      DATABASE_URL: postgresql+psycopg://asm:asm@localhost:5432/asm_test
      JWT_SECRET_KEY: ci-test-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMeAdmin123!
      ADMIN_FULL_NAME: Platform Admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q
